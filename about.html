<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker">关于</p>
            <h1>关于</h1>
          </div>
        </header>

        <section class="card about-hero">
          <div class="about-title">
            <span class="about-name" id="about-name">工作台</span>
            <span class="about-version" id="about-version"></span>
          </div>
          <p class="sub" id="about-desc"></p>
        </section>

        <div class="about-grid">
          <section class="card">
            <div class="card-head">
              <h2>署名</h2>
            </div>
            <div class="info-list">
              <span class="info-label">作者</span>
              <span class="info-value" id="about-author"></span>
              <span class="info-label">工作台版本</span>
              <span class="info-value"><code id="about-version-row"></code></span>
              <span class="info-label">版权</span>
              <span class="info-value" id="about-copyright"></span>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>运行信息</h2>
            </div>
            <div class="info-list">
              <span class="info-label">本地服务</span>
              <span class="info-value" id="about-host"></span>
              <span class="info-label">数据文件夹</span>
              <span class="info-value" id="about-folder"></span>
              <span class="info-label">配置文件</span>
              <span class="info-value"><code id="about-ini"></code></span>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
