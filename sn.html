<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品目录查询</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/favicon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker">产品目录查询</p>
            <h1>产品目录查询</h1>
            <p class="sub">按序列号查产品数据所在的目录，路径来自服务端扫盘。</p>
            <p id="sn-status" class="sub"></p>
          </div>
        </header>
        <form id="sn-form" class="card sn-form">
          <input id="sn-input" type="text" autocomplete="off" placeholder="输入 SN" aria-label="产品目录查询" required>
          <button class="btn primary" type="submit">打开</button>
        </form>
        <div id="sn-results" class="card resource-table-card" hidden>
          <div class="resource-table-wrap">
            <table class="resource-table">
              <thead>
                <tr>
                  <th>SN</th>
                  <th>PN</th>
                  <th>Spec</th>
                  <th>路径</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="sn-body"></tbody>
            </table>
          </div>
        </div>
        <section class="card catalog-card">
          <div class="catalog-head">
            <div>
              <h2>扫盘路径</h2>
              <p id="scan-status" class="sub">还没有配置根目录。</p>
            </div>
            <button type="button" id="scan-run" class="btn primary">更新路径</button>
          </div>
          <div class="scan-roots-edit">
            <input id="scan-root-input" type="text" spellcheck="false" autocomplete="off"
                   placeholder="\\server\share\root 或 D:\data，回车添加">
            <button type="button" id="scan-root-browse" class="btn">浏览…</button>
            <button type="button" id="scan-root-add" class="btn">添加</button>
          </div>
          <div id="scan-root-list" class="scan-root-list"></div>
          <div id="scan-warn" class="scan-warn" hidden></div>
          <div id="scan-overview" class="scan-overview" hidden>
            <div class="scan-stats" id="scan-stats"></div>
            <div id="scan-roots-stat" class="scan-roots-stat"></div>
          </div>
          <div id="scan-filter" class="catalog-filters" hidden>
            <label>
              <span>Spec</span>
              <select id="scan-filter-spec"></select>
            </label>
            <label>
              <span>PN</span>
              <select id="scan-filter-pn"></select>
            </label>
          </div>
          <div id="scan-detail" class="scan-detail" hidden>
            <div class="scan-detail-head">
              <span id="scan-detail-title" class="sub"></span>
              <span id="scan-detail-pager" class="scan-pager"></span>
            </div>
            <div class="resource-table-wrap">
              <table class="resource-table">
                <thead>
                  <tr>
                    <th>SN</th>
                    <th>PN</th>
                    <th>Spec</th>
                    <th>路径</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="scan-detail-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/sn.js"></script>
</body>
</html>
