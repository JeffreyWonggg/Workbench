<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/favicon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker">待办</p>
            <h1>待办事项</h1>
            <p class="sub" id="todo-counts"></p>
          </div>
          <div class="row-actions">
            <button type="button" id="batch-toggle" class="btn" aria-pressed="false">批量</button>
          </div>
        </header>
        <div class="filters">
          <div id="project-filters" class="chips"></div>
          <div id="state-filters" class="chips"></div>
        </div>
        <form id="todo-add" class="card add-row">
          <button type="button" id="add-toggle" class="add-toggle" aria-expanded="false" aria-controls="add-fields">
            <svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>
            <span>添加任务</span>
          </button>
          <div id="add-fields" class="add-fields" hidden>
            <input id="todo-title" type="text" placeholder="事项" aria-label="事项" required>
            <select id="todo-project" aria-label="项目"></select>
            <select id="todo-state" aria-label="状态"></select>
            <input id="todo-date" type="date" aria-label="记录日期" title="记录日期">
            <input id="todo-span" type="number" min="1" step="1" placeholder="天数" aria-label="持续天数" title="持续天数：填了自动填好截止日期，当天算第 1 天（填 1 就是当天截止）">
            <input id="todo-due" type="date" aria-label="截止日期" title="截止日期">
            <button class="btn primary" type="submit">添加</button>
          </div>
        </form>
        <div id="todo-list"></div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/todo.js"></script>
</body>
</html>
