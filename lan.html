<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>局域网传文件</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/favicon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker">局域网</p>
            <h1>局域网传文件</h1>
          </div>
          <div class="row-actions">
            <button type="button" id="lan-refresh" class="btn">刷新列表</button>
          </div>
        </header>

        <div class="lan-grid">
          <section id="lan-access" class="card">
            <div class="card-head">
              <h2>手机 / 其它电脑访问</h2>
            </div>
            <div id="lan-urls" class="lan-urls"></div>
            <div id="lan-qr" class="lan-qr"></div>
            <p class="sub">同一 WiFi 或局域网下打开上面的地址，即可上传或下载文件。</p>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>发送到这台电脑</h2>
            </div>
            <div id="lan-drop" class="lan-drop">
              <p>把文件或文件夹拖到这里</p>
              <div class="lan-drop-actions">
                <button type="button" id="lan-pick" class="btn primary">选择文件</button>
                <button type="button" id="lan-dir" class="btn">选择文件夹</button>
              </div>
              <input id="lan-input" type="file" multiple hidden>
              <input id="lan-dir-input" type="file" webkitdirectory directory multiple hidden>
            </div>
            <div id="lan-progress" class="lan-progress" role="status" aria-live="polite"></div>
          </section>
        </div>

        <section class="card">
          <div class="card-head">
            <h2>已接收文件</h2>
            <span id="lan-count" class="muted"></span>
          </div>
          <div id="lan-crumbs" class="lan-crumbs"></div>
          <div id="lan-files" class="lan-files"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/lan.js"></script>
</body>
</html>
