<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/favicon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker" id="project-kicker">项目</p>
            <h1 id="project-title">项目</h1>
          </div>
          <div class="row-actions" id="project-actions" hidden>
            <a class="btn" id="project-todo-link" href="todo.html">在待办里打开</a>
            <a class="btn" id="project-note-link" href="notes.html">去记笔记</a>
          </div>
        </header>

        <div id="project-overview" class="project-overview" hidden></div>

        <div id="project-detail" class="project-grid" hidden>
          <section class="card timeline-card">
            <div class="card-head">
              <h2>时间线</h2>
              <span id="project-timeline-count" class="muted"></span>
            </div>
            <div id="project-timeline" class="timeline"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>待办</h2>
              <span id="project-todo-count" class="muted"></span>
            </div>
            <div id="project-todo-list"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>笔记</h2>
              <span id="project-note-count" class="muted"></span>
            </div>
            <div id="project-note-list"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>周报工时</h2>
              <span id="project-report-count" class="muted"></span>
            </div>
            <div id="project-report-box"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>资料</h2>
              <span id="project-resource-count" class="muted"></span>
            </div>
            <div id="project-resource-list"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>文件</h2>
              <span id="project-file-count" class="muted"></span>
            </div>
            <div id="project-file-list"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>代码</h2>
              <span id="project-code-count" class="muted"></span>
            </div>
            <div id="project-code-list"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>软件号</h2>
              <span id="project-software-count" class="muted"></span>
            </div>
            <div id="project-software-list"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/gitapi.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
