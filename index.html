<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preload" href="fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/favicon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="gate" hidden></div>
      <div id="content" hidden>
        <header class="page-head">
          <div>
            <p class="kicker" id="week-kicker"></p>
            <h1>工作台</h1>
          </div>
          <div class="row-actions" aria-label="工具栏">
            <button type="button" id="home-layout" class="btn" aria-pressed="false" aria-label="调整卡片布局">布局</button>
          </div>
        </header>
        <form id="capture" class="capture card">
          <button type="button" id="capture-toggle" class="add-toggle" aria-expanded="false" aria-controls="capture-fields">
            <svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>
            <span>记一条</span>
          </button>
          <div id="capture-fields" class="capture-fields" hidden>
            <select id="capture-project" aria-label="项目"></select>
            <input id="capture-text" type="text" autocomplete="off" placeholder="写一条正在做的事，回车收下">
            <button class="btn primary" type="submit">收下</button>
          </div>
        </form>
        <div id="home-cards" class="home-cards">
          <section id="usage-card" class="card home-card" data-card="usage" hidden>
            <div class="card-head">
              <h2>DeepSeek</h2>
              <div class="usage-actions">
                <button type="button" id="usage-refresh" class="linkish">刷新</button>
                <button type="button" id="usage-note" class="linkish">说明</button>
              </div>
            </div>
            <div id="usage-body"></div>
          </section>

          <section id="focus-card" class="card home-card" data-card="focus" hidden>
            <div class="card-head">
              <h2>今天要做的</h2>
              <a href="todo.html">全部待办</a>
            </div>
            <div id="focus-list" class="focus-list"></div>
          </section>

          <section class="card home-card" data-card="doing">
            <div class="card-head">
              <h2>进行中</h2>
              <a href="todo.html">全部待办</a>
            </div>
            <div id="doing-list"></div>
          </section>

          <section class="card home-card" data-card="week">
            <div class="card-head">
              <h2>本周周报</h2>
              <a href="weekly.html?week=current">去写</a>
            </div>
            <div id="week-box"></div>
          </section>

          <section class="card home-card" data-card="notes">
            <div class="card-head">
              <h2>最近笔记</h2>
              <a href="notes.html">全部笔记</a>
            </div>
            <div id="note-box"></div>
          </section>

          <section class="card home-card" data-card="git" hidden>
            <div class="card-head">
              <h2>代码仓库</h2>
              <a href="code.html">去代码页</a>
            </div>
            <div id="git-box"></div>
          </section>

          <section class="card home-card" data-card="ledger" hidden>
            <div class="card-head">
              <h2>本月记账</h2>
              <a href="ledger.html">去记账</a>
            </div>
            <div id="ledger-box"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/model.js"></script>
  <script src="js/gitapi.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/sync-crypto.js"></script>
  <script src="js/sync-core.js"></script>
  <script src="js/sync-cloudbase.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/openrouter.local.js"></script>
  <script src="js/deepseek.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
